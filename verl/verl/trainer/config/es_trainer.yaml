# Evolution Strategy (ES) Trainer Configuration
# This config follows the same structure as ppo_trainer.yaml for consistency

defaults:
  - _self_

# ES Algorithm Configuration
es:
  # Core ES hyperparameters
  sigma: 0.001  # Noise scale for weight perturbation
  alpha: 0.0005  # Learning rate for ES update
  population_size: 30  # Number of perturbations per iteration
  num_engines: 4  # Number of parallel vLLM engines
  num_iterations: 800  # Total training iterations
  
  # Model precision
  precision: bfloat16  # float16, bfloat16, or float32
  
  # Generation settings
  max_tokens: 1024
  temperature: 0.0  # Use greedy decoding by default
  
  # Evaluation settings
  eval_interval: 25  # Evaluate every N iterations (0 to disable)
  eval_batch_size: 512
  eval_max_tokens: null  # null -> reuse es.max_tokens

  # Problems rolled out per ES iteration, resampled from the training pool each
  # iteration (reference impl: DataLoader(shuffle=True), batch_size=1024 for math).
  # 0 = use the whole pool as one fixed batch (old behaviour).
  train_batch_size: 0
  
  # vLLM settings
  gpu_memory_utilization: 0.9
  worker_extension_cls: "verl.workers.rollout.vllm_rollout.es_worker_extension.WorkerExtension"
  
  # Maximum vLLM context (null -> model default). Qwen2.5-Math-7B is 4096.
  max_model_len: null

  # ---- Subspace-restricted perturbation (structured ES) -------------------------
  # off      : original in-place bf16 perturbation of every parameter
  # dense    : same subspace as `off` (all parameters) but with an fp32 master weight
  # zoact    : ZO-Act (arXiv:2607.01125) -- dW = C @ V_r, V_r = top-r right singular
  #            vectors of the layer's input activations (one-shot calibration)
  # insparse : perturb only the top-`insparse_density` input channels of each weight,
  #            ranked by calibration activation RMS
  # fura     : full-rank BTT (output_one_block, s_merged_to=keep_frozen), perturb the
  #            small core only (train_position=small)
  # iso      : ISO (arXiv:2607.19331) fixed-spectrum ES -- W <- C_L W C_R^T with
  #            C_L, C_R exactly orthogonal (Cayley of a block-diagonal skew in a
  #            per-seed permuted basis).  Singular values are preserved exactly; only
  #            the singular frames U, V move.
  # isobtt   : same constraint on the block-wise SVD used by `fura`: per input block
  #            W_j = A_j R_j with A_j = U_j diag(S_j) frozen and R_j in O(b) trained,
  #            so each block's spectrum is fixed and the trainable state is ~1.3% of
  #            the model instead of a full fp32 master.
  perturb_mode: "off"
  calib_path: null          # .pt produced by scripts/es/calibrate_activations.py
  subspace_rank: 1          # r for zoact
  insparse_density: 0.01    # fraction of input channels kept for insparse
  fura_swap_blocks: false   # swap (n_blocks, block_size) from the closest-factor default
  iso_block_size: 128       # block size of the skew generator (cost is O(b * |W|))
  iso_perm: true            # re-draw the block basis every seed (reaches all of O(m))

  # Evaluate the untouched base model before iteration 1 and log it at step 0.
  eval_before_train: true
  # Save the ES coefficients whenever eval accuracy improves.
  save_best_coef: false

  # Random seed (null for random)
  global_seed: 42
  
  # Verbose logging
  verbose: false

# Model Configuration
model:
  path: Qwen/Qwen2.5-3B-Instruct
  trust_remote_code: false

# Data Configuration
data:
  # Task type: countdown, gsm8k, math, math500, olympiadbench, or custom
  # - countdown: Uses {numbers}/{target} prompts and <answer> tags
  # - gsm8k: Uses {question} prompts and #### answer format
  # - math: Uses {problem} prompts and \boxed{} format
  # - math500: Uses verl parquet format with \boxed{} (no custom templates needed)
  # - olympiadbench: Uses verl parquet format with \boxed{} (no custom templates needed)
  task_type: countdown
  
  # Data files (JSON or Parquet format)
  # For olympiadbench/math500: use parquet with prompt/reward_model/extra_info fields
  train_files: data/countdown.json
  val_files: data/countdown.json
  
  # Data limits
  train_max_samples: 200  # Use -1 for all
  val_max_samples: -1  # Evaluation uses samples after train_max_samples
  
  # Task-specific prompts (ONLY used by countdown/gsm8k/math tasks)
  # These are IGNORED for math500/olympiadbench which use parquet prompt field directly
  system_message: "You are a helpful assistant. You first think about the reasoning process in your mind and then provide the user with the answer."
  user_template: "Using the numbers {numbers}, create an equation that equals {target}. You can use basic arithmetic operations (+, -, *, /) and each number can only be used once. Show your work in <think> </think> tags. And return the final answer in <answer> </answer> tags, for example <answer> (1 + 2) / 3 </answer>."
  response_prompt: "Let me solve this step by step.\n<think>"
  
  # Custom task configuration (for custom task type)
  # Set these to actual paths when using task_type=custom
  reward_fn_path: null
  reward_fn_name: null
  prompt_processor_path: null
  prompt_processor_name: null

# Trainer Configuration
trainer:
  # Logging
  project_name: es-training
  experiment_name: countdown-es
  logger:
    - tensorboard
    # - wandb  # Uncomment to enable WandB
  
  # Directories
  default_local_dir: /tmp/${oc.env:USER}/verl/es_checkpoints
  default_hdfs_dir: null
  
  # Device settings
  device: cuda
  n_gpus_per_node: 4
  nnodes: 1
  
  # Training iterations (alternative to es.num_iterations)
  total_epochs: null  # If set, overrides es.num_iterations
  
  # Evaluation frequency (alternative to es.eval_interval)
  test_freq: null  # If set, overrides es.eval_interval
  
  # Checkpoint settings
  save_freq: 100  # Save checkpoint every N iterations (0 to disable)
  
  # Profiling
  npu_profile:
    enable: false

# Ray Configuration
ray_kwargs:
  ray_init:
    runtime_env: {}
