# es_token (per-token weight-perturbation ES) trainer configuration.
# Mirrors np_trainer.yaml structure. See docs/plans/es_token_trainer.md.
defaults:
  - _self_

es_token:
  # core perturbation knobs
  sigma: 0.01
  sigma_mode: absolute             # absolute | relative (sigma * RMS(W_l))
  n_sample: 8                      # N perturbed rails per decode step (+1 clean)
  sample_method: bernoulli         # Rademacher (u,v) -> exact rail orthogonality
  batch_size: 64                   # prompts accumulated into ONE update
  perturb_rules:                   # vLLM-real fused names; default ALL decoder linears
    - '^model\.layers\.\d+\.(self_attn\.(qkv_proj|o_proj)|mlp\.(gate_up_proj|down_proj))$'

  # estimator / update
  grad_estimate_sample: mean_baseline  # mean_baseline | clean_baseline
  reward_weight_mode: student_iw       # student_iw | student_p | none (DEGENERATE)
  iw_clamp: 10.0
  token_agg: sum                   # sum | mean over token records
  lr: 1.0e-3                       # all-layer scale (NP lesson: ~30x below single-layer)
  update_clip: null
  assemble_chunk: 1024             # token-records per assembly GEMM chunk

  # decode driver (graphed packed; eager only as the parity oracle)
  use_cuda_graph: true
  pack_width: 4                    # B_pack per wave (KV ceiling, wiki §10.5/§11.3)
  b_pack_buckets: [2, 4]           # fixed CUDA-graph bucket widths

  # teacher (sampled-token: ONE prefill per rollout, prompt_logprobs=1)
  teacher_model_path: null         # required
  teacher_temperature: 1.0
  teacher_batch_size: 16
  log_prob_top_k: 1                # sampled-token needs only the actual token

  # engine / eval (mirror np_trainer.yaml; consumed by inherited launch/eval)
  num_engines: 1
  num_iterations: 150
  precision: bfloat16
  max_tokens: 1024
  temperature: 0.0
  eval_interval: 25
  eval_batch_size: 256
  heldout_probe_size: 16
  gpu_memory_utilization: 0.55
  teacher_gpu_memory_utilization: 0.30
  gpu_fraction: 0.5                # co-locate student+teacher on one GPU
  distributed_executor_backend: uni
  verify_update: true
  global_seed: 42
  verbose: false
  worker_extension_cls: "verl.workers.rollout.vllm_rollout.es_token_worker_extension.WorkerExtension"

model:
  path: model/Qwen3-1.7B
  trust_remote_code: false

data:
  task_type: opd_math
  train_files: datasets/dapo-math-17k.parquet
  val_files: datasets/test_data/MATH-500/test.parquet
  train_max_samples: 200
  val_max_samples: -1
  reward_fn_path: null
  reward_fn_name: null
  prompt_processor_path: null
  prompt_processor_name: null

trainer:
  project_name: OPD-ES-TOKEN
  experiment_name: es-token-run
  logger:
    - console
  default_local_dir: /tmp/${oc.env:USER}/verl/es_token_checkpoints
  default_hdfs_dir: null
  device: cuda
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: null
  test_freq: null
  save_freq: 100
  npu_profile:
    enable: false

ray_kwargs:
  ray_init:
    runtime_env: {}
