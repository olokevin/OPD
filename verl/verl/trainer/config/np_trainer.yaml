# Node-Perturbation (NP) Trainer Configuration
# Mirrors es_trainer.yaml structure. See docs/superpowers/specs/2026-05-28-np-trainer-design.md
defaults:
  - _self_

np:
  # core NP knobs
  sigma: 0.01
  n_sample: 8                      # perturbed copies scored per decode step
  n_rollout: 1                     # rollouts per prompt (kept for back-compat)
  batch_size: 1                    # distinct prompts accumulated into ONE delta_W per update
  sample_method: bernoulli         # gaussian | bernoulli | uniform
  en_layerwise_perturbation: true  # false = perturb all matched layers at once
  # --- V2 decode driver (spec docs/.../2026-06-03-np-v2-cudagraph-rails.md) ---
  decode_mode: eager               # eager (V1) | graphed (V2 per-prompt graph) | packed | packed_graphed (V3 fully-graphed packed all-layer)
  use_cuda_graph: false            # graphed only: false = M1 eager-with-u_buf, true = M2 captured graph
  pack_width: 8                    # packed only: prompts per wide forward (B_pack)
  b_pack_buckets: [2, 4, 8, 16]    # packed_graphed only: fixed CUDA-graph bucket widths (pad active prompts up)
  teacher_batch_size: 16           # batch B prompts' teacher prefill into one generate (serial fallback <=1)
  topk_store_k: 512                # decode-side stored top-k window width (>= log_prob_top_k for union/intersection)
  perturb_method: forward          # forward (one-sided) | antithetic
  perturb_granularity: token       # token | rollout
  grad_estimate_sample: grpo       # average | grpo   (over n_sample, per-token)
  grad_estimate_sequence: grpo     # average | grpo   (over n_rollout)
  perturb_rules:
    - '^model\.layers\.\d+\.mlp\.down_proj$'   # vLLM-real names (see spec §4)
  lr: 1.0e-4
  token_agg: sum                   # sum | mean
  normalize_anp: false             # ANP per-sample 1/||u||^2 rescale. OFF by default:
                                   # for Rademacher noise ||u||^2 == d_out, so it shrinks
                                   # the whole update by 1/d_out (~1/2048) and forces an
                                   # absurd lr. See scripts/zo_opd/results/ANALYSIS.md.
  update_clip: null                # per-element |delta_W| clamp (null = none)

  # teacher scorer (v1, core)
  teacher_model_path: null         # required for loss_type=opd
  loss_type: opd                   # opd (teacher reverse-KL) | grpo (rule reward)
  log_prob_top_k: 256
  top_k_strategy: only_stu         # only_stu | only_tch | intersection | union | union-intersection
  teacher_temperature: 1.0
  reward_weight_mode: student_p    # student_p | teacher_p | none

  # engine / eval (mirror es_trainer.yaml)
  num_engines: 4
  num_iterations: 800
  precision: bfloat16
  max_tokens: 1024
  temperature: 0.0
  eval_interval: 25
  eval_batch_size: 256
  gpu_memory_utilization: 0.7
  teacher_gpu_memory_utilization: null   # falls back to gpu_memory_utilization
  gpu_fraction: 1.0                       # <1 co-locates student+teacher on one GPU (fractional PG)
  distributed_executor_backend: ray       # "uni" (in-process worker) required for fractional/co-located GPU
  verify_update: true                     # per-step check that the weight moved + synced to all engines
  global_seed: 42
  verbose: false
  worker_extension_cls: "verl.workers.rollout.vllm_rollout.np_worker_extension.WorkerExtension"

model:
  path: model/Qwen3-1.7B
  trust_remote_code: false

data:
  task_type: opd_math
  train_files: datasets/dapo-math-17k.parquet
  val_files: datasets/test_data/AIME24/test.parquet
  train_max_samples: 200
  val_max_samples: -1
  reward_fn_path: null
  reward_fn_name: null
  prompt_processor_path: null
  prompt_processor_name: null

trainer:
  project_name: OPD-NP
  experiment_name: np-run
  logger:
    - console
    - wandb
  default_local_dir: /tmp/${oc.env:USER}/verl/np_checkpoints
  default_hdfs_dir: null
  device: cuda
  n_gpus_per_node: 8
  nnodes: 1
  total_epochs: null
  test_freq: null
  save_freq: 100
  npu_profile:
    enable: false

ray_kwargs:
  ray_init:
    runtime_env: {}
