### model
model_name_or_path: Qwen/Qwen3-1.7B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: blocktt
deepspeed: examples/deepspeed/ds_z2_config.json
flash_attn: fa2
enable_liger_kernel: true

# Compress / BlockTT knobs
decomp_mode: input_one_block
blocktt_rank: full
convert_mode: svd
trainable_type: all
train_position: small
s_merged_to: frozen
train_bias: true
blocktt_normalize_after_update: false
blocktt_factorize_by_head: true
calib_mode: none

### dataset
dataset: openthought3_qwen3_4b
template: qwen3
enable_thinking: false
cutoff_len: 14336
preprocessing_num_workers: 64
dataloader_num_workers: 64

### output
output_dir: ../model/Qwen3-1.7B-Base-BlockTT-OpenThought3-4B
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.05
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100

### swanlab / wandb
use_swanlab: false
swanlab_project: llamafactory
swanlab_run_name: Qwen3-1.7B-Base-BlockTT-OpenThought3-4B
run_name: Qwen3-1.7B-Base-BlockTT-OpenThought3-4B
