### model
# Source = Qwen3-4B-Base (non-thinking base). BlockTT compresses it in-place to
# ~1.7B-parameter budget via calib_mode: v2_combined + blocktt_rank as a keep
# ratio, then SFT follows. Architecture (hidden_size, num_layers, num_heads)
# stays Qwen3-4B's — only the per-linear factorization shrinks the param count.
model_name_or_path: Qwen/Qwen3-4B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: blocktt
deepspeed: examples/deepspeed/ds_z2_config.json
flash_attn: fa2
enable_liger_kernel: true

# Compress / BlockTT knobs (calibrated, v2_combined)
decomp_mode: input_one_block
# Keep ratio of compressible params. Qwen3-1.7B / Qwen3-4B ≈ 1.71 / 4.02 ≈ 0.43.
blocktt_rank: "0.43"
convert_mode: svd
trainable_type: all
train_position: small
s_merged_to: frozen
train_bias: true
blocktt_normalize_after_update: false
blocktt_factorize_by_head: true
calib_mode: v2_combined         # v2 | v2_bp | v2_combined | twosteps
calib_source: c4                # c4 | traces | training_data
calib_num_seqs: 128
calib_max_length: 2048
calib_seed: 3
calib_batch_size: 8
calib_traces_path: null
compression_ratio: 1.0

### dataset
dataset: openthought3_qwen3_4b
template: qwen3
enable_thinking: false
cutoff_len: 14336
preprocessing_num_workers: 64
dataloader_num_workers: 64

### output
output_dir: /data/yequan/compress_train/OPD/Qwen3-4B-to-1.7B-BTT-v2_combined-OpenThought3-4B
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.05
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 100

### swanlab / wandb
use_swanlab: false
swanlab_project: llamafactory
swanlab_run_name: Qwen3-4B-to-1.7B-BTT-v2_combined-OpenThought3-4B
run_name: Qwen3-4B-to-1.7B-BTT-v2_combined-OpenThought3-4B
