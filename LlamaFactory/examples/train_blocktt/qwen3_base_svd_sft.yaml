### model
model_name_or_path: Qwen/Qwen3-1.7B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: svd
deepspeed: examples/deepspeed/ds_z2_config.json
flash_attn: fa2
enable_liger_kernel: true

# Compress / SVD knobs
trainable_type: all
train_position: output          # svd: output | input | both
s_merged_to: frozen
calib_mode: none                # set to svd_v2 / svd_v2_combined for calibrated SVD
compression_ratio: 1.0          # ignored when calib_mode=none

### dataset
dataset: openthought3_qwen3_4b
template: qwen3
enable_thinking: false
cutoff_len: 20480
preprocessing_num_workers: 64
dataloader_num_workers: 64

### output
output_dir: ../model/Qwen3-1.7B-Base-SVD-OpenThought3-4B
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.05
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100

### swanlab / wandb
use_swanlab: false
swanlab_project: llamafactory
swanlab_run_name: Qwen3-1.7B-Base-SVD-OpenThought3-4B
run_name: Qwen3-1.7B-Base-SVD-OpenThought3-4B
