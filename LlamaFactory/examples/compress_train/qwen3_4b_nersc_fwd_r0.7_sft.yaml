### NERSC reasoning-aware compress-then-train: Qwen3-4B (NON-thinking), FORWARD-only.
### SVD-LLM-V2 on self_attn + Nystrom on MLP, retain 0.7, last decoder layer DENSE,
### then SFT on OpenThoughts3-Qwen3-4B. Compression is in-process at model-init
### (finetuning_type=svd_nystrom); the compressed factors stay TRAINABLE.
### Multi-node (4 nodes x 4 GPU = 16-way DDP) — driven by slurm/compress_sft/*.
### Launch via the controller, NOT directly (see slurm/compress_sft/).

### model
model_name_or_path: Qwen/Qwen3-4B          # non-thinking (enable_thinking=false below)
trust_remote_code: true

### method — in-process SVD(attn)+Nystrom(mlp) compression, factors trainable
stage: sft
do_train: true
finetuning_type: svd_nystrom
calib_mode: svd_v2              # forward-only (input-whitened SVD + forward Nystrom)
compression_ratio: 0.7          # RETAIN ratio
skip_last_layers: 1             # last decoder layer left DENSE (attn AND MLP, untouched)
trainable_type: all             # compress every self_attn + every MLP triplet
train_position: output
# NOTE: svd_nystrom ALWAYS sqrt-splits the singular values S onto BOTH cores
# (svd_llm_v2.py: V_r=Vh.T*sqrt(S), U_r=(U*sqrt(S)).T) and trains BOTH U_r and V_r.
# So "S split to both cores" + "train both cores" are inherent to this path;
# s_merged_to below is recorded for intent but is not consulted by svd_nystrom.
s_merged_to: split
calib_source: traces
calib_traces_path: /pscratch/sd/y/yequan/opd/datasets/OpenThought3-Qwen3-4B/data/train.jsonl
calib_num_seqs: 128            # default calibration (full-seq, never-truncated, seq-reweighted)
flash_attn: sdpa             # fa2 unavailable on torch2.12+cu130; sdpa fallback
enable_liger_kernel: false   # disabled: illegal-mem-access on the Nystrom-shrunk MLP

### dataset
dataset: openthought3_qwen3_4b
template: qwen3
enable_thinking: false
cutoff_len: 10240
preprocessing_num_workers: 64
dataloader_num_workers: 8

### output (overridden by the launcher's output_dir=)
output_dir: /pscratch/sd/y/yequan/opd/compress_sft/sft/qwen3_4b/forward_r0.7
logging_steps: 10
save_steps: 100             # ~9.5k total steps (305k*2ep/64); 100 -> small loss on 4h expiry
save_total_limit: 1         # keep ONLY the latest factored + -merged checkpoint
save_only_model: false      # also save optimizer/scheduler -> exact resume
plot_loss: true
overwrite_output_dir: false  # false so resume_from_checkpoint can pick up the ckpt
report_to: wandb
run_name: qwen3_4b_nersc_compress_fwd_r0.7_sft

### train — global update batch = per_device * grad_accum * world(16) = 64
### 4 nodes x 4 GPU = 16 ranks (multi-node SVD-compress works via the serialize-
### compress fix in compress_setup.py). Two jobs run concurrently, 4 nodes each.
### grad_accum lowered 8->2 vs the 1-node run to KEEP global batch at 64 across 16 ranks.
per_device_train_batch_size: 2     # CE loss (vocab 151936 x seq 10240) OOMs at 4
gradient_accumulation_steps: 2     # 2 * 2 * 16 = 64
gradient_checkpointing: true        # needed: frees activations for the big CE loss
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval — val-loss only (heavy in-trainer task_eval disabled: task_eval_steps=0).
### Benchmark eval (MATH-500 + MMLU-Pro) runs post-hoc in the verl env.
val_size: 0.005
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 100

### swanlab off (we use wandb)
use_swanlab: false
