### Reasoning-aware compress-then-train: Qwen3-4B-Base, FORWARD+BACKWARD combined.
### SVD on self_attn + Nystrom on MLP, retain 0.7, then SFT on OpenThoughts3.
### Launch in the `sft` conda env:
###   CUDA_VISIBLE_DEVICES=2 WANDB_PROJECT=compress_sft_qwen3_4b_base \
###     llamafactory-cli train examples/compress_train/qwen3_4b_compressed_combined_sft.yaml

### model
model_name_or_path: Qwen/Qwen3-4B-Base
trust_remote_code: true

### method — in-process SVD(attn)+Nystrom(mlp) compression, factors trainable
stage: sft
do_train: true
finetuning_type: svd_nystrom
calib_mode: svd_v2_combined    # forward+backward (doubly-whitened SVD + joint Nystrom)
compression_ratio: 0.7
skip_last_layers: 1
trainable_type: all
train_position: output
s_merged_to: frozen
calib_source: traces
calib_traces_path: /home/yequan/Project/compression/OPD/datasets/OpenThought3-Qwen3-4B/data/train.jsonl
calib_num_seqs: 128
deepspeed: examples/deepspeed/ds_z2_config.json
flash_attn: sdpa              # FA2 not installed in sft env; SDPA = memory-efficient attn
enable_liger_kernel: false   # disabled: caused illegal-mem-access on the Nystrom-shrunk MLP

### dataset
dataset: openthought3_qwen3_4b
template: qwen3
enable_thinking: false
cutoff_len: 4096             # single-GPU full-FT of a 4B: 14k context OOMs
preprocessing_num_workers: 64
dataloader_num_workers: 64

### output
output_dir: /data/yequan/compress_sft/sft/qwen3_4b_base/combined_r0.7
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
run_name: qwen3_4b_base_compress_combined_r0.7_sft

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8     # effective batch 16, fits one 96GB GPU at 4k ctx
gradient_checkpointing: true
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval — mid-training val-loss growth curve to wandb
val_size: 0.02
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100

### swanlab off (we use wandb)
use_swanlab: false
