### SMOKE phase 1: train 3 steps, save a compressed-format checkpoint. Then re-run
### with resume_from_checkpoint to confirm svd_nystrom training resumes correctly.
###   CUDA_VISIBLE_DEVICES=5 ... llamafactory-cli train _smoke_qwen3_resume.yaml
### then edit max_steps->6 + resume_from_checkpoint and re-run.
model_name_or_path: Qwen/Qwen3-4B-Base
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: svd_nystrom
calib_mode: svd_v2
compression_ratio: 0.7
skip_last_layers: 1
trainable_type: all
train_position: output
s_merged_to: frozen
calib_source: traces
calib_traces_path: /home/yequan/Project/compression/OPD/datasets/OpenThought3-Qwen3-4B/data/train.jsonl
calib_num_seqs: 16
flash_attn: fa2
enable_liger_kernel: false
dataset: openthought3_qwen3_4b
template: qwen3
enable_thinking: false
cutoff_len: 4096
max_samples: 200
preprocessing_num_workers: 16
dataloader_num_workers: 16
output_dir: /data/yequan/compress_sft/smoke/qwen3_resume
logging_steps: 1
save_steps: 3
save_total_limit: 1
save_only_model: false
max_steps: 3
overwrite_output_dir: true
report_to: none
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
use_swanlab: false
